name: GameMap progress site

# Publishes GameMap/site (static progress dashboard) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The site contains only measurements (data.js); the code viewer's "code pack" (site/code/) is git-ignored and never published.

on:
  push:
    branches: [main, master]
    paths: ["GameMap/site/**", ".github/workflows/gamemap-pages.yml"]
  pull_request:
    branches: [main, master]
    paths: ["GameMap/site/**", ".github/workflows/gamemap-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamemap-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s GameMap/site/index.html
          test -s GameMap/site/style.css
          node --check GameMap/site/app.js
          node --check GameMap/site/data.js
          if [ -d GameMap/site/code ]; then echo "site/code must not be published"; exit 1; fi
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish game code
        run: |
          if [ -d GameMap/site/code ]; then echo "site/code must not be published"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GameMap/site
      - id: deployment
        uses: actions/deploy-pages@v4
