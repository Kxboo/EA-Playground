[package]
name = "eagl-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "EA Playground asset workbench and evidence-based reconstruction workspace"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["default_app", "3d_bevy_render", "scene", "bevy_winit", "multi_threaded", "std", "keyboard", "mouse"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "EAGL-Workbench"
path = "src/main.rs"
